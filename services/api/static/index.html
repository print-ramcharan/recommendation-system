<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommendation Engine Simulator</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Recommendation Engine Simulator</h1>
      <p style="color: var(--text-secondary);">Real-time simulation, A/B testing evaluation, and semantic vector indexing</p>
    </header>

    <div class="grid">
      <!-- Section: Recommendations Simulation -->
      <div class="card">
        <h2 class="card-title">👤 Personalized Simulator</h2>
        <div class="form-group">
          <label for="userIdInput">Simulate User ID</label>
          <input type="number" id="userIdInput" value="8888" placeholder="Enter user ID (e.g. 8888)">
        </div>
        <div class="form-group">
          <label for="limitSelect">k Recommendations</label>
          <select id="limitSelect">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
          </select>
        </div>
        <button id="getRecsBtn">Generate Recommendations</button>

        <div id="recStats" style="margin-top: 1.5rem; display: none;">
          <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <div>
              <span style="font-size: 0.75rem; color: var(--text-secondary); display: block;">Experiment Group</span>
              <span id="experimentBadge" class="badge">GROUP A</span>
            </div>
            <div>
              <span style="font-size: 0.75rem; color: var(--text-secondary); display: block;">Response Time</span>
              <span id="responseTimeVal" style="font-weight: 700; color: var(--accent-blue);">0.00ms</span>
            </div>
          </div>
          <div id="recsList"></div>
        </div>
      </div>

      <!-- Section: Semantic Search -->
      <div class="card">
        <h2 class="card-title">🔍 Semantic Vector Search</h2>
        <div class="form-group">
          <label for="searchQueryInput">Natural Language Query</label>
          <input type="text" id="searchQueryInput" placeholder="Type a search concept (e.g. Machine Learning, Sports matches)">
        </div>
        <button id="searchBtn">Search Vector DB</button>

        <div id="searchResultsSection" style="margin-top: 1.5rem; display: none;">
          <div id="searchResultsList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
